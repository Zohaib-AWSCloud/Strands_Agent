[project]
name = "fsi-agentcore-workshop"
version = "1.0.0"
description = "FSI-themed Bedrock AgentCore + Strands Agents Workshop for TAMs"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.6.0",
    "strands-agents-tools>=0.2.5",
    "rich>=13.0.0",
    "boto3>=1.35.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
    "playwright>=1.40.0",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "ddgs>=6.0.0",
    "bedrock-agentcore>=1.0.0",
    "bedrock-agentcore-starter-toolkit>=0.3.9",
]

[dependency-groups]
dev = []
